services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - inven-db-data:/var/lib/mysql
    networks:
      - inven-net

  api:
    image: inven-api:v2
    container_name: inven-api
    ports:
      - "8010:8010"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    depends_on:
      - mysql
    networks:
      - inven-net

volumes:
  inven-db-data:
    external: true

networks:
  inven-net:
    external: true
